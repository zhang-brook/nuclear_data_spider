<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>辐射环境监测数据 · 基础查询</title>
    <link rel="stylesheet" href="./common.css">
    <script src="./layout.js" defer></script>
    <style>
        .result-card table {
            min-width: 560px;
        }

        .calendar-block {
            margin-top: 16px;
        }

        .calendar-head {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 4px 12px;
        }

        .calendar-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--text);
        }

        .calendar-meta,
        .calendar-hint {
            color: var(--muted);
            font-size: 12px;
            font-variant-numeric: tabular-nums;
        }

        .multi-field {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .multi-field input {
            min-width: 0;
        }

        .multi-field .link-btn {
            flex: 0 0 auto;
            font-size: 12px;
            white-space: nowrap;
        }

        .range-field {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .range-field select {
            flex: 1 1 0;
            min-width: 0;
        }

        .range-field .range-sep {
            flex: 0 0 auto;
            color: var(--muted);
            font-size: 12px;
        }

        .calendar-actions {
            display: flex;
            gap: 10px;
            font-size: 12px;
        }

        .calendar-legend {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-left: auto;
            color: var(--muted);
            font-size: 12px;
        }

        .calendar-legend span {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .legend-dot {
            width: 9px;
            height: 9px;
            border-radius: 2px;
        }

        .legend-dot.has {
            background: #bbf7d0;
            border: 1px solid #86efac;
        }

        .legend-dot.none {
            background: #f1f5f9;
            border: 1px solid #e2e8f0;
        }

        .calendar-strip {
            display: flex;
            gap: 4px;
            margin-top: 8px;
            padding: 3px 2px;
            overflow-x: auto;
            scrollbar-width: thin;
            user-select: none;
        }

        .calendar-day {
            display: flex;
            flex: 0 0 auto;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1px;
            width: 30px;
            height: 30px;
            padding: 0;
            border: 1px solid transparent;
            border-radius: 6px;
            font: inherit;
            font-size: 11px;
            font-variant-numeric: tabular-nums;
            line-height: 1.1;
        }

        .calendar-day.has {
            background: #bbf7d0;
            border-color: #86efac;
            color: #166534;
            cursor: pointer;
        }

        .calendar-day.has:hover {
            border-color: #16a34a;
            box-shadow: 0 2px 6px rgba(22, 101, 52, .18);
        }

        .calendar-day.none {
            background: #f1f5f9;
            border-color: #eef2f7;
            color: #94a3b8;
            cursor: pointer;
        }

        .calendar-day.none:hover {
            border-color: #cbd5e1;
        }

        .calendar-day.selected,
        .calendar-day:focus-visible {
            outline: 2px solid var(--primary);
            outline-offset: 1px;
        }

        .calendar-month {
            font-size: 8px;
            line-height: 1;
            opacity: .85;
        }

        .calendar-state {
            flex: 1 0 100%;
            margin: 0;
            padding: 8px 0;
            color: var(--muted);
            font-size: 12px;
            text-align: center;
        }

        @media (max-width: 720px) {
            .calendar-legend {
                margin-left: 0;
            }

            .calendar-hint::after {
                content: ' · 左右滑动';
            }
        }
    </style>
</head>

<body>
    <header id="site-nav" class="topbar"></header>
    <div class="stats-bar">
        <div class="wrap stats" id="stats">
            <div class="stat"><b>加载中…</b><span>数据概览</span></div>
        </div>
    </div>

    <main class="wrap">
        <form id="form" class="card filter-card" autocomplete="off">
            <div class="filter-grid">
                <label class="field">监测点类型
                    <select id="type" name="type">
                        <option value="">全部类型</option>
                        <option value="0">环境质量监测点</option>
                        <option value="1">核电厂监测点</option>
                    </select>
                </label>
                <label class="field">名称
                    <select id="name" name="name" required>
                        <option value="">请选择名称</option>
                    </select>
                </label>
                <label class="field">位置
                    <select id="location" name="location" required>
                        <option value="">请选择位置</option>
                    </select>
                </label>
                <label class="field">查询方式
                    <select id="mode" name="mode">
                        <option value="date" selected>指定日期</option>
                        <option value="range">指定日期范围</option>
                        <option value="latest">最近 N 条</option>
                    </select>
                </label>
                <div class="field" id="date-field">
                    <label for="date">日期</label>
                    <input type="date" id="date" name="date" required min="2023-08-25">
                    <div class="multi-field" id="date-multi-wrap" hidden>
                        <input type="text" id="date-multi" readonly aria-label="已选日期">
                        <button type="button" id="date-multi-clear" class="link-btn">清除选择</button>
                    </div>
                </div>
                <div class="field span-2" id="range-field" hidden>
                    <span>日期范围</span>
                    <div class="range-field">
                        <select id="range-start" aria-label="开始日期"></select>
                        <span class="range-sep">至</span>
                        <select id="range-end" aria-label="结束日期"></select>
                    </div>
                </div>
                <label class="field" id="limit-field" hidden>最近条数
                    <select id="limit" name="limit">
                        <option value="10">10 条</option>
                        <option value="20">20 条</option>
                        <option value="50" selected>50 条</option>
                        <option value="100">100 条</option>
                        <option value="200">200 条</option>
                        <option value="500">500 条</option>
                        <option value="1000">1000 条</option>
                    </select>
                </label>
            </div>
            <div class="calendar-block" id="calendar-card">
                <div class="calendar-head">
                    <span class="calendar-title">快捷选择日期</span>
                    <span class="calendar-meta" id="calendar-meta"></span>
                    <span class="calendar-hint">可多选，按住拖动批量选择/取消</span>
                    <div class="calendar-actions">
                        <button type="button" id="calendar-select-all" class="link-btn">全选</button>
                        <button type="button" id="calendar-invert" class="link-btn">反选</button>
                        <button type="button" id="calendar-clear" class="link-btn">清除</button>
                    </div>
                    <div class="calendar-legend" aria-hidden="true">
                        <span><i class="legend-dot has"></i>有数据</span>
                        <span><i class="legend-dot none"></i>无数据</span>
                    </div>
                </div>
                <div class="calendar-strip" id="calendar-grid"></div>
            </div>
            <div class="filter-foot">
                <p class="meta" id="query-hint">数据自 2023-08-25 起收录 · 仅查询所选日期</p>
                <div class="actions">
                    <button type="button" id="reset-btn" class="btn ghost">重置</button>
                    <button type="submit" id="submit-btn" class="btn primary">查询</button>
                </div>
            </div>
        </form>

        <section class="card result-card">
            <div class="result-head">
                <div>
                    <h2>查询结果</h2>
                    <p class="meta" id="result-meta">选择监测点后查询</p>
                </div>
            </div>
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>日期</th>
                            <th>数值</th>
                            <th>类型</th>
                            <th>数据更新时间</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="tbody"></tbody>
                </table>
            </div>
        </section>
    </main>

    <footer id="site-footer" class="footer"></footer>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script>
        (function () {
            'use strict'

            const API_BASE = (location.hostname === 'localhost' || location.hostname === '127.0.0.1')
                ? 'http://localhost:35590/'
                : '/api/'
            const MIN_DATE = '2023-08-25'

            const $ = (id) => document.getElementById(id)

            const el = {
                form: $('form'),
                type: $('type'),
                name: $('name'),
                location: $('location'),
                mode: $('mode'),
                dateField: $('date-field'),
                rangeField: $('range-field'),
                rangeStart: $('range-start'),
                rangeEnd: $('range-end'),
                limitField: $('limit-field'),
                limit: $('limit'),
                date: $('date'),
                dateMultiWrap: $('date-multi-wrap'),
                dateMulti: $('date-multi'),
                dateMultiClear: $('date-multi-clear'),
                resetBtn: $('reset-btn'),
                submitBtn: $('submit-btn'),
                hint: $('query-hint'),
                meta: $('result-meta'),
                calendarMeta: $('calendar-meta'),
                calendarGrid: $('calendar-grid'),
                calendarSelectAll: $('calendar-select-all'),
                calendarInvert: $('calendar-invert'),
                calendarClear: $('calendar-clear'),
                tbody: $('tbody'),
                toast: $('toast'),
            }

            let optionsTree = []
            let requestSeq = 0
            let calendarSeq = 0
            let toastTimer = null
            let selectedDates = new Set()
            let calendarDrag = null
            let calendarClickGuard = false

            const collator = new Intl.Collator('zh-Hans-CN')

            async function request(path, options) {
                const response = await fetch(API_BASE + path, options)
                if (!response.ok) {
                    const text = await response.text().catch(() => '')
                    throw new Error(text || `请求失败（HTTP ${response.status}）`)
                }
                return response.json()
            }

            function post(path, data) {
                return request(path, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data),
                })
            }

            function pad2(value) {
                return String(value).padStart(2, '0')
            }

            function dateString(date) {
                return `${date.getFullYear()}-${pad2(date.getMonth() + 1)}-${pad2(date.getDate())}`
            }

            // 接口返回的 date 由 mysql2 转成 UTC 时间戳，展示时换回东八区日期
            function displayDate(value) {
                if (!value) return '—'
                if (/^\d{4}-\d{2}-\d{2}$/.test(value)) return value
                const date = new Date(value)
                if (isNaN(date.getTime())) return value
                return new Date(date.getTime() + 8 * 3600 * 1000).toISOString().slice(0, 10)
            }

            function setDefaultDate() {
                el.date.value = dateString(new Date(Date.now() - 2 * 24 * 3600 * 1000))
                el.date.max = dateString(new Date())
                selectedDates = new Set([el.date.value])
            }

            function rangeOptionGroups() {
                const groups = new Map()
                const end = new Date()
                const cursor = new Date(`${MIN_DATE}T00:00:00`)
                while (cursor <= end) {
                    const text = dateString(cursor)
                    const key = text.slice(0, 7)
                    if (!groups.has(key)) groups.set(key, [])
                    groups.get(key).push(text)
                    cursor.setDate(cursor.getDate() + 1)
                }
                return groups
            }

            function fillRangeSelect(select, groups) {
                const fragment = document.createDocumentFragment()
                for (const [key, dates] of groups) {
                    const group = document.createElement('optgroup')
                    group.label = `${key.slice(0, 4)} 年 ${Number(key.slice(5, 7))} 月`
                    for (const date of dates) group.appendChild(new Option(date, date))
                    fragment.appendChild(group)
                }
                select.replaceChildren(fragment)
            }

            function defaultRange() {
                const end = el.date.value || dateString(new Date(Date.now() - 2 * 24 * 3600 * 1000))
                const start = new Date(`${end}T00:00:00`)
                start.setDate(start.getDate() - 6)
                const startText = dateString(start)
                return { start: startText < MIN_DATE ? MIN_DATE : startText, end }
            }

            function resetRangeValues() {
                const range = defaultRange()
                el.rangeStart.value = range.start
                el.rangeEnd.value = range.end
            }

            function fillRangeOptions() {
                const groups = rangeOptionGroups()
                fillRangeSelect(el.rangeStart, groups)
                fillRangeSelect(el.rangeEnd, groups)
                resetRangeValues()
            }

            function isContinuousDates(dates) {
                for (let index = 1; index < dates.length; index++) {
                    const previous = new Date(`${dates[index - 1]}T00:00:00`)
                    previous.setDate(previous.getDate() + 1)
                    if (dateString(previous) !== dates[index]) return false
                }
                return true
            }

            function rangeDates(start, end) {
                const dates = []
                const cursor = new Date(`${start}T00:00:00`)
                const last = new Date(`${end}T00:00:00`)
                while (cursor <= last) {
                    dates.push(dateString(cursor))
                    cursor.setDate(cursor.getDate() + 1)
                }
                return dates
            }

            // 只有一天为指定日期；多天连续自动切到指定日期范围；不连续仍按所选日期集合查询
            function syncSelectionMode() {
                const dates = [...selectedDates].sort()
                if (dates.length > 1 && isContinuousDates(dates)) {
                    el.mode.value = 'range'
                    el.rangeStart.value = dates[0]
                    el.rangeEnd.value = dates[dates.length - 1]
                    return
                }
                el.mode.value = 'date'
            }

            function toast(message, kind) {
                el.toast.textContent = message
                el.toast.className = 'toast show' + (kind === 'error' ? ' error' : '')
                clearTimeout(toastTimer)
                toastTimer = setTimeout(() => {
                    el.toast.className = 'toast'
                }, 3200)
            }

            function fillSelect(select, values, keep) {
                const first = select.options[0]
                select.replaceChildren(first)
                for (const value of values) {
                    select.add(new Option(value, value))
                }
                select.value = values.includes(keep) ? keep : ''
            }

            function namesFor(type) {
                const names = new Set()
                for (const item of optionsTree) {
                    if (!type || item.type === type) names.add(item.name)
                }
                return [...names].sort(collator.compare)
            }

            function locationsFor(type, name) {
                const locations = new Set()
                for (const item of optionsTree) {
                    if (type && item.type !== type) continue
                    if (name && item.name !== name) continue
                    for (const location of item.locations) locations.add(location)
                }
                return [...locations].sort(collator.compare)
            }

            async function loadOptionsTree() {
                try {
                    optionsTree = await request('nuclear_data/options/tree')
                } catch (error) {
                    optionsTree = []
                    toast('监测点选项加载失败', 'error')
                }
            }

            // 选择下级时反推名称/类型，选择上级时过滤下级
            function syncSelects(source) {
                if (source === 'name' && el.name.value) {
                    const owner = optionsTree.find((item) => item.name === el.name.value)
                    if (owner) el.type.value = owner.type
                }
                if (source === 'location' && el.location.value) {
                    const owner = optionsTree.find((item) => item.locations.includes(el.location.value))
                    if (owner && !el.name.value) {
                        el.name.value = owner.name
                        el.type.value = owner.type
                    }
                }
                fillSelect(el.name, namesFor(el.type.value), el.name.value)
                fillSelect(el.location, locationsFor(el.type.value, el.name.value), el.location.value)
            }

            function oneOf(value, allowed, fallback) {
                return allowed.includes(value) ? value : fallback
            }

            function syncUrl(mode) {
                const params = new URLSearchParams()
                const queryMode = el.mode.value
                const latest = queryMode === 'latest'
                const range = queryMode === 'range'
                const dates = [...selectedDates].sort()
                const pairs = [
                    ['type', el.type.value],
                    ['name', el.name.value],
                    ['location', el.location.value],
                    ['mode', latest ? 'latest' : range ? 'range' : ''],
                    ['limit', latest ? el.limit.value : ''],
                    ['ds', range && dates.length ? dates[0] : ''],
                    ['de', range && dates.length ? dates[dates.length - 1] : ''],
                ]
                for (const [key, value] of pairs) {
                    if (value) params.set(key, value)
                }
                if (!latest && !range) params.set('dates', dates.join(','))
                const query = params.toString()
                const url = query ? `${location.pathname}?${query}` : location.pathname
                if (url === location.pathname + location.search) return
                history[mode === 'push' ? 'pushState' : 'replaceState'](null, '', url)
            }

            function isDateOption(value) {
                return typeof value === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(value)
                    && value >= MIN_DATE && value <= dateString(new Date())
            }

            function restoreFromUrl() {
                const params = new URLSearchParams(location.search)
                el.type.value = oneOf(params.get('type'), ['0', '1'], '')
                const mode = oneOf(params.get('mode'), ['latest', 'range'], 'date')
                el.limit.value = String(oneOf(Number(params.get('limit')), [10, 20, 50, 100, 200, 500, 1000], 50))
                const fallback = defaultRange()
                let rangeStart = isDateOption(params.get('ds')) ? params.get('ds') : fallback.start
                let rangeEnd = isDateOption(params.get('de')) ? params.get('de') : fallback.end
                if (rangeStart > rangeEnd) {
                    const swap = rangeStart
                    rangeStart = rangeEnd
                    rangeEnd = swap
                }
                el.rangeStart.value = rangeStart
                el.rangeEnd.value = rangeEnd
                el.mode.value = mode
                if (mode === 'range') {
                    selectedDates = new Set(rangeDates(rangeStart, rangeEnd))
                } else if (params.has('dates')) {
                    selectedDates = new Set(params.get('dates').split(',').filter(isDateOption))
                    if (mode === 'date') syncSelectionMode()
                }
                syncDateValue()
                const nameParam = params.get('name') || ''
                const locationParam = params.get('location') || ''
                const owner = optionsTree.find((item) => item.name === nameParam)
                if (owner && !el.type.value) el.type.value = owner.type
                fillSelect(el.name, namesFor(el.type.value), nameParam)
                fillSelect(el.location, locationsFor(el.type.value, el.name.value), locationParam)
                updateModeFields()
                syncUrl('replace')
            }

            function showNoSelection() {
                el.meta.textContent = '选择监测点后查询'
                showMessage('选择名称和位置后查询', 'empty')
            }

            function showMessage(text, className) {
                el.tbody.replaceChildren()
                const tr = document.createElement('tr')
                const td = document.createElement('td')
                td.colSpan = 5
                td.className = 'state-cell' + (className ? ` ${className}` : '')
                td.textContent = text
                tr.appendChild(td)
                el.tbody.appendChild(tr)
            }

            function typeCell(type) {
                const td = document.createElement('td')
                const badge = document.createElement('span')
                if (type === '0') {
                    badge.className = 'badge env'
                    badge.textContent = '环境'
                    badge.title = '环境质量监测点'
                } else if (type === '1') {
                    badge.className = 'badge nuclear'
                    badge.textContent = '核电'
                    badge.title = '核电厂监测点'
                } else {
                    badge.className = 'badge station'
                    badge.textContent = type || '—'
                }
                td.appendChild(badge)
                return td
            }

            function valueCell(value) {
                const td = document.createElement('td')
                td.className = 'num'
                const match = /^\s*([\d.]+)\s*(.*)$/.exec(value || '')
                if (!match) {
                    td.textContent = value || '—'
                    return td
                }
                const num = document.createElement('b')
                num.textContent = match[1]
                td.appendChild(num)
                if (match[2]) {
                    const unit = document.createElement('span')
                    unit.className = 'unit'
                    unit.textContent = match[2]
                    td.appendChild(unit)
                }
                return td
            }

            function copyCell(row) {
                const td = document.createElement('td')
                td.className = 'nowrap'
                const button = document.createElement('button')
                button.type = 'button'
                button.className = 'link-btn'
                button.title = '复制该行数据'
                button.textContent = '复制'
                button.addEventListener('click', async () => {
                    const copied = await siteUtils.copyText(siteUtils.rowCopyText(row, displayDate(row.date)))
                    toast(copied ? '已复制到剪贴板' : '复制失败', copied ? undefined : 'error')
                })
                td.appendChild(button)
                return td
            }

            function renderRows(rows) {
                el.tbody.replaceChildren()
                const fragment = document.createDocumentFragment()
                for (const row of rows) {
                    const tr = document.createElement('tr')
                    const dateCell = document.createElement('td')
                    dateCell.className = 'nowrap'
                    dateCell.textContent = displayDate(row.date)
                    const timeCell = document.createElement('td')
                    timeCell.className = 'nowrap muted'
                    timeCell.textContent = row.time || '—'
                    tr.append(dateCell, valueCell(row.value), typeCell(row.type), timeCell, copyCell(row))
                    fragment.appendChild(tr)
                }
                el.tbody.appendChild(fragment)
            }

            function setLoading(busy) {
                el.submitBtn.disabled = busy
                el.submitBtn.textContent = busy ? '查询中…' : '查询'
            }

            function updateModeFields() {
                const mode = el.mode.value
                const latest = mode === 'latest'
                const range = mode === 'range'
                const multi = !latest && !range && selectedDates.size > 1
                const dates = [...selectedDates].sort()
                el.dateField.hidden = latest || range
                el.rangeField.hidden = !range
                el.limitField.hidden = !latest
                el.date.hidden = multi
                el.dateMultiWrap.hidden = !multi
                el.date.required = !latest && !range && !multi
                if (multi) {
                    el.dateMulti.value = `已选 ${selectedDates.size} 天`
                    el.dateMulti.title = dates.join('、')
                } else {
                    el.dateMulti.value = ''
                    el.dateMulti.removeAttribute('title')
                }
                el.hint.textContent = latest
                    ? '数据自 2023-08-25 起收录 · 查看该测点最近 N 条记录'
                    : range
                        ? `数据自 2023-08-25 起收录 · 查询 ${dates[0] || '—'} ~ ${dates[dates.length - 1] || '—'} 的记录`
                        : multi
                            ? `数据自 2023-08-25 起收录 · 已选 ${selectedDates.size} 天，仅查询所选日期`
                            : '数据自 2023-08-25 起收录 · 仅查询指定日期'
                markSelectedDates()
            }

            function calendarWindow() {
                const end = new Date()
                const start = new Date(end.getFullYear(), end.getMonth(), end.getDate() - 29)
                return { start, end, startText: dateString(start), endText: dateString(end) }
            }

            function showCalendarState(text) {
                el.calendarGrid.replaceChildren()
                const state = document.createElement('p')
                state.className = 'calendar-state'
                state.textContent = text
                el.calendarGrid.appendChild(state)
            }

            function renderEmptyCalendar() {
                calendarSeq++
                const { start, end, startText, endText } = calendarWindow()
                el.calendarMeta.textContent = `${startText} ~ ${endText}`
                renderCalendar(new Set(), start, end, startText)
            }

            function markSelectedDates() {
                const show = el.mode.value !== 'latest'
                for (const cell of el.calendarGrid.querySelectorAll('.calendar-day')) {
                    const selected = show && selectedDates.has(cell.dataset.date)
                    cell.classList.toggle('selected', selected)
                    cell.setAttribute('aria-pressed', selected ? 'true' : 'false')
                }
            }

            function syncDateValue() {
                el.date.value = selectedDates.size === 1 ? [...selectedDates][0] : ''
            }

            function commitSelection(query = true) {
                syncDateValue()
                syncSelectionMode()
                updateModeFields()
                if (query) runQuery({ push: true })
            }

            function calendarDates() {
                return [...el.calendarGrid.querySelectorAll('.calendar-day')].map((cell) => cell.dataset.date)
            }

            function applyCalendarSelection(dates) {
                selectedDates = new Set(dates)
                commitSelection()
            }

            function selectAllCalendarDates() {
                const dates = calendarDates()
                if (dates.length) applyCalendarSelection(dates)
            }

            function invertCalendarDates() {
                const dates = calendarDates()
                if (!dates.length) return
                applyCalendarSelection(dates.filter((date) => !selectedDates.has(date)))
            }

            function clearCalendarDates() {
                selectedDates = new Set()
                commitSelection(false)
                syncUrl('push')
                requestSeq++
                setLoading(false)
                if (!el.name.value || !el.location.value) {
                    el.meta.textContent = '请选择名称和位置'
                    showMessage('请选择名称和位置', 'empty')
                    return
                }
                el.meta.textContent = '请选择日期'
                showMessage('请选择日期', 'empty')
            }

            function selectCalendarDate(date) {
                if (el.mode.value === 'latest') {
                    selectedDates = new Set([date])
                } else if (selectedDates.has(date)) {
                    selectedDates.delete(date)
                } else {
                    selectedDates.add(date)
                }
                commitSelection()
            }

            function calendarCellAt(x, y) {
                for (const cell of el.calendarGrid.querySelectorAll('.calendar-day')) {
                    const rect = cell.getBoundingClientRect()
                    if (x >= rect.left && x <= rect.right && y >= rect.top && y <= rect.bottom) return cell
                }
                return null
            }

            // 按住拖动时按起始格状态决定这一笔是选择还是取消，中途经过的格子一并处理
            function applyDragDates(fromDate, toDate) {
                const dates = calendarDates()
                const from = dates.indexOf(fromDate)
                const to = dates.indexOf(toDate)
                if (from < 0 || to < 0) return
                let changed = false
                for (let index = Math.min(from, to); index <= Math.max(from, to); index++) {
                    const date = dates[index]
                    if (calendarDrag.applied.has(date)) continue
                    calendarDrag.applied.add(date)
                    if (calendarDrag.mode === 'select') selectedDates.add(date)
                    else selectedDates.delete(date)
                    changed = true
                }
                if (!changed) return
                commitSelection(false)
            }

            function moveCalendarDrag(event) {
                if (!calendarDrag) return
                const cell = calendarCellAt(event.clientX, event.clientY)
                if (!cell) return
                const date = cell.dataset.date
                if (!calendarDrag.moved) {
                    if (date === calendarDrag.lastDate) return
                    calendarDrag.moved = true
                    if (el.mode.value === 'latest') selectedDates = new Set()
                }
                applyDragDates(calendarDrag.lastDate, date)
                calendarDrag.lastDate = date
            }

            function stopCalendarDrag() {
                window.removeEventListener('pointermove', moveCalendarDrag)
                window.removeEventListener('pointerup', stopCalendarDrag)
                window.removeEventListener('pointercancel', stopCalendarDrag)
                window.removeEventListener('blur', stopCalendarDrag)
                if (!calendarDrag) return
                const moved = calendarDrag.moved
                calendarDrag = null
                if (!moved) return
                calendarClickGuard = true
                setTimeout(() => {
                    calendarClickGuard = false
                }, 0)
                runQuery({ push: true })
            }

            function startCalendarDrag(event) {
                if (event.button !== 0 || event.pointerType === 'touch') return
                const cell = event.target.closest('.calendar-day')
                if (!cell) return
                stopCalendarDrag()
                const date = cell.dataset.date
                const deselect = el.mode.value !== 'latest' && selectedDates.has(date)
                calendarDrag = {
                    mode: deselect ? 'deselect' : 'select',
                    lastDate: date,
                    moved: false,
                    applied: new Set(),
                }
                window.addEventListener('pointermove', moveCalendarDrag)
                window.addEventListener('pointerup', stopCalendarDrag)
                window.addEventListener('pointercancel', stopCalendarDrag)
                window.addEventListener('blur', stopCalendarDrag)
            }

            function renderCalendar(dates, start, end, startText) {
                el.calendarGrid.replaceChildren()
                const fragment = document.createDocumentFragment()
                const cursor = new Date(start.getFullYear(), start.getMonth(), start.getDate())
                while (cursor <= end) {
                    const text = dateString(cursor)
                    const hasData = dates.has(text)
                    const cell = document.createElement('button')
                    cell.type = 'button'
                    cell.className = 'calendar-day ' + (hasData ? 'has' : 'none')
                    cell.dataset.date = text
                    cell.textContent = String(cursor.getDate())
                    cell.setAttribute('aria-pressed', 'false')
                    if (hasData) {
                        cell.title = `${text} · 有数据`
                        cell.setAttribute('aria-label', `${text}，有数据，点击选择或取消`)
                    } else {
                        cell.title = `${text} · 无数据`
                        cell.setAttribute('aria-label', `${text}，无数据，点击选择或取消`)
                    }
                    cell.addEventListener('click', () => {
                        if (calendarClickGuard) return
                        selectCalendarDate(text)
                    })
                    if (cursor.getDate() === 1 || text === startText) {
                        const month = document.createElement('span')
                        month.className = 'calendar-month'
                        month.textContent = `${cursor.getMonth() + 1}月`
                        cell.appendChild(month)
                    }
                    fragment.appendChild(cell)
                    cursor.setDate(cursor.getDate() + 1)
                }
                el.calendarGrid.appendChild(fragment)
                markSelectedDates()
                el.calendarGrid.scrollLeft = el.calendarGrid.scrollWidth
            }

            async function loadCalendar(name, location) {
                const seq = ++calendarSeq
                const { start, end, startText, endText } = calendarWindow()

                el.calendarMeta.textContent = `${startText} ~ ${endText}`
                showCalendarState('加载中…')

                try {
                    const result = await post('nuclear_data/list', {
                        name,
                        location,
                        dateStart: startText,
                        dateEnd: endText,
                        page: 1,
                        pageSize: 200,
                        sortBy: 'date',
                        sortOrder: 'asc',
                    })
                    if (seq !== calendarSeq) return
                    const dates = new Set((result.rows || []).map((row) => row.date))
                    renderCalendar(dates, start, end, startText)
                } catch (error) {
                    if (seq !== calendarSeq) return
                    showCalendarState('日历加载失败')
                }
            }

            function refreshCalendar() {
                if (!el.name.value || !el.location.value) {
                    renderEmptyCalendar()
                    return
                }
                loadCalendar(el.name.value, el.location.value)
            }

            function resetFilters() {
                requestSeq++
                setLoading(false)
                el.form.reset()
                setDefaultDate()
                resetRangeValues()
                updateModeFields()
                syncSelects('type')
                syncUrl('push')
                refreshCalendar()
                showNoSelection()
            }

            async function runQuery(options = {}) {
                if (options.push) syncUrl('push')
                if (!el.name.value || !el.location.value) {
                    requestSeq++
                    setLoading(false)
                    el.meta.textContent = '请选择名称和位置'
                    showMessage('请选择名称和位置', 'empty')
                    return
                }
                const mode = el.mode.value
                if (mode === 'date' && selectedDates.size === 0) {
                    requestSeq++
                    setLoading(false)
                    el.meta.textContent = '请选择日期'
                    showMessage('请选择日期', 'empty')
                    toast('请选择日期', 'error')
                    return
                }
                if (mode === 'range' && selectedDates.size === 0) {
                    requestSeq++
                    setLoading(false)
                    el.meta.textContent = '请选择日期范围'
                    showMessage('请选择日期范围', 'empty')
                    toast('请选择日期范围', 'error')
                    return
                }
                const limit = Math.min(Math.max(Number(el.limit.value) || 50, 10), 1000)

                const seq = ++requestSeq
                setLoading(true)
                el.meta.textContent = '查询中…'
                showMessage('查询中…')

                try {
                    let rows
                    if (mode === 'latest') {
                        const result = await post('nuclear_data/list', {
                            type: el.type.value,
                            name: el.name.value,
                            location: el.location.value,
                            latestLimit: limit,
                            sortBy: 'date',
                            sortOrder: 'desc',
                        })
                        if (seq !== requestSeq) return
                        rows = result.rows || []
                        el.meta.textContent = `${el.name.value} · ${el.location.value} · 最近 ${limit} 条 · 共 ${rows.length} 条`
                    } else if (mode === 'range') {
                        const dates = [...selectedDates].sort()
                        const start = dates[0]
                        const end = dates[dates.length - 1]
                        rows = await post('nuclear_data', {
                            type: el.type.value,
                            name: el.name.value,
                            location: el.location.value,
                            dateStart: start,
                            dateEnd: end,
                        })
                        if (seq !== requestSeq) return
                        el.meta.textContent = `${el.name.value} · ${el.location.value} · ${start} ~ ${end} · 共 ${rows.length} 条`
                    } else if (selectedDates.size > 1) {
                        const dates = [...selectedDates].sort()
                        const result = await post('nuclear_data/list', {
                            type: el.type.value,
                            name: el.name.value,
                            location: el.location.value,
                            dates,
                            page: 1,
                            pageSize: 1000,
                            sortBy: 'date',
                            sortOrder: 'desc',
                        })
                        if (seq !== requestSeq) return
                        rows = result.rows || []
                        el.meta.textContent = `${el.name.value} · ${el.location.value} · 已选 ${dates.length} 天 · 共 ${rows.length} 条`
                    } else {
                        const date = [...selectedDates][0]
                        rows = await post('nuclear_data', {
                            type: el.type.value,
                            name: el.name.value,
                            location: el.location.value,
                            date,
                        })
                        if (seq !== requestSeq) return
                        el.meta.textContent = `${el.name.value} · ${el.location.value} · ${date} · 共 ${rows.length} 条`
                    }

                    if (!rows.length) {
                        showMessage('没有找到符合条件的数据', 'empty')
                        return
                    }
                    renderRows(rows)
                } catch (error) {
                    if (seq !== requestSeq) return
                    el.meta.textContent = '查询失败'
                    showMessage(error.message || '查询失败', 'error')
                } finally {
                    if (seq === requestSeq) setLoading(false)
                }
            }

            el.type.addEventListener('change', () => {
                syncSelects('type')
                refreshCalendar()
                runQuery({ push: true })
            })

            el.name.addEventListener('change', () => {
                syncSelects('name')
                refreshCalendar()
                runQuery({ push: true })
            })

            el.location.addEventListener('change', () => {
                syncSelects('location')
                refreshCalendar()
                runQuery({ push: true })
            })

            el.mode.addEventListener('change', () => {
                const mode = el.mode.value
                if (mode === 'latest') {
                    updateModeFields()
                    runQuery({ push: true })
                    return
                }
                const dates = [...selectedDates].sort()
                if (mode === 'range') {
                    let start
                    let end
                    if (!dates.length) {
                        const range = defaultRange()
                        start = range.start
                        end = range.end
                    } else {
                        end = dates[dates.length - 1]
                        start = dates[0]
                        if (dates.length === 1) {
                            const cursor = new Date(`${end}T00:00:00`)
                            cursor.setDate(cursor.getDate() - 6)
                            const startText = dateString(cursor)
                            start = startText < MIN_DATE ? MIN_DATE : startText
                        }
                    }
                    selectedDates = new Set(rangeDates(start, end))
                    el.rangeStart.value = start
                    el.rangeEnd.value = end
                    syncDateValue()
                } else if (dates.length) {
                    selectedDates = new Set([dates[dates.length - 1]])
                    syncDateValue()
                }
                updateModeFields()
                runQuery({ push: true })
            })

            el.limit.addEventListener('change', () => runQuery({ push: true }))

            el.date.addEventListener('change', () => {
                selectedDates = el.date.value ? new Set([el.date.value]) : new Set()
                syncDateValue()
                syncSelectionMode()
                updateModeFields()
                runQuery({ push: true })
            })

            function onRangeChange(event) {
                if (el.rangeStart.value > el.rangeEnd.value) {
                    if (event.target === el.rangeStart) el.rangeEnd.value = el.rangeStart.value
                    else el.rangeStart.value = el.rangeEnd.value
                }
                selectedDates = new Set(rangeDates(el.rangeStart.value, el.rangeEnd.value))
                syncDateValue()
                updateModeFields()
                runQuery({ push: true })
            }

            el.rangeStart.addEventListener('change', onRangeChange)
            el.rangeEnd.addEventListener('change', onRangeChange)

            el.calendarSelectAll.addEventListener('click', selectAllCalendarDates)
            el.calendarInvert.addEventListener('click', invertCalendarDates)
            el.calendarClear.addEventListener('click', clearCalendarDates)
            el.dateMultiClear.addEventListener('click', clearCalendarDates)
            el.calendarGrid.addEventListener('pointerdown', startCalendarDrag)

            el.resetBtn.addEventListener('click', resetFilters)

            el.form.addEventListener('submit', (event) => {
                event.preventDefault()
                runQuery({ push: true })
            })

            window.addEventListener('popstate', async () => {
                restoreFromUrl()
                refreshCalendar()
                if (el.name.value && el.location.value) runQuery()
                else showNoSelection()
            })

            async function init() {
                setDefaultDate()
                fillRangeOptions()
                updateModeFields()
                await loadOptionsTree()
                syncSelects('type')
                restoreFromUrl()
                refreshCalendar()
                if (el.name.value && el.location.value) runQuery()
                else showNoSelection()
            }

            init()
        })()
    </script>
</body>

</html>
