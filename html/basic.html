<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>辐射环境监测数据 · 基础查询</title>
    <link rel="stylesheet" href="./common.css">
    <script src="./layout.js" defer></script>
    <style>
        .result-card table {
            min-width: 560px;
        }
    </style>
</head>

<body>
    <header id="site-nav" class="topbar"></header>

    <main class="wrap">
        <form id="form" class="card filter-card" autocomplete="off">
            <div class="filter-grid">
                <label class="field">监测点类型
                    <select id="type" name="type">
                        <option value="">全部类型</option>
                        <option value="0">环境质量监测点</option>
                        <option value="1">核电厂监测点</option>
                    </select>
                </label>
                <label class="field">名称
                    <select id="name" name="name" required>
                        <option value="">请选择名称</option>
                    </select>
                </label>
                <label class="field">位置
                    <select id="location" name="location" required>
                        <option value="">请选择位置</option>
                    </select>
                </label>
                <label class="field">日期
                    <input type="date" id="date" name="date" required min="2023-08-25">
                </label>
            </div>
            <div class="filter-foot">
                <p class="meta">数据自 2023-08-25 起收录 · 展示所选日期及前 3 天的记录</p>
                <div class="actions">
                    <button type="submit" id="submit-btn" class="btn primary">查询</button>
                </div>
            </div>
        </form>

        <section class="card result-card">
            <div class="result-head">
                <div>
                    <h2>查询结果</h2>
                    <p class="meta" id="result-meta">选择监测点后查询</p>
                </div>
            </div>
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>日期</th>
                            <th>数值</th>
                            <th>类型</th>
                            <th>数据更新时间</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="tbody"></tbody>
                </table>
            </div>
        </section>
    </main>

    <footer id="site-footer" class="footer"></footer>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script>
        (function () {
            'use strict'

            const API_BASE = (location.hostname === 'localhost' || location.hostname === '127.0.0.1')
                ? 'http://localhost:35590/'
                : '/api/'

            const $ = (id) => document.getElementById(id)

            const el = {
                form: $('form'),
                type: $('type'),
                name: $('name'),
                location: $('location'),
                date: $('date'),
                submitBtn: $('submit-btn'),
                meta: $('result-meta'),
                tbody: $('tbody'),
                toast: $('toast'),
            }

            let optionsTree = []
            let requestSeq = 0
            let toastTimer = null

            const collator = new Intl.Collator('zh-Hans-CN')

            async function request(path, options) {
                const response = await fetch(API_BASE + path, options)
                if (!response.ok) {
                    const text = await response.text().catch(() => '')
                    throw new Error(text || `请求失败（HTTP ${response.status}）`)
                }
                return response.json()
            }

            function post(path, data) {
                return request(path, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data),
                })
            }

            function pad2(value) {
                return String(value).padStart(2, '0')
            }

            function dateString(date) {
                return `${date.getFullYear()}-${pad2(date.getMonth() + 1)}-${pad2(date.getDate())}`
            }

            // 接口返回的 date 由 mysql2 转成 UTC 时间戳，展示时换回东八区日期
            function displayDate(value) {
                if (!value) return '—'
                if (/^\d{4}-\d{2}-\d{2}$/.test(value)) return value
                const date = new Date(value)
                if (isNaN(date.getTime())) return value
                return new Date(date.getTime() + 8 * 3600 * 1000).toISOString().slice(0, 10)
            }

            function setDefaultDate() {
                el.date.value = dateString(new Date(Date.now() - 2 * 24 * 3600 * 1000))
                el.date.max = dateString(new Date(Date.now() - 24 * 3600 * 1000))
            }

            function toast(message, kind) {
                el.toast.textContent = message
                el.toast.className = 'toast show' + (kind === 'error' ? ' error' : '')
                clearTimeout(toastTimer)
                toastTimer = setTimeout(() => {
                    el.toast.className = 'toast'
                }, 3200)
            }

            function fillSelect(select, values, keep) {
                const first = select.options[0]
                select.replaceChildren(first)
                for (const value of values) {
                    select.add(new Option(value, value))
                }
                select.value = values.includes(keep) ? keep : ''
            }

            function namesFor(type) {
                const names = new Set()
                for (const item of optionsTree) {
                    if (!type || item.type === type) names.add(item.name)
                }
                return [...names].sort(collator.compare)
            }

            function locationsFor(type, name) {
                const locations = new Set()
                for (const item of optionsTree) {
                    if (type && item.type !== type) continue
                    if (name && item.name !== name) continue
                    for (const location of item.locations) locations.add(location)
                }
                return [...locations].sort(collator.compare)
            }

            async function loadOptionsTree() {
                try {
                    optionsTree = await request('nuclear_data/options/tree')
                } catch (error) {
                    optionsTree = []
                    toast('监测点选项加载失败', 'error')
                }
            }

            // 选择下级时反推名称/类型，选择上级时过滤下级
            function syncSelects(source) {
                if (source === 'name' && el.name.value) {
                    const owner = optionsTree.find((item) => item.name === el.name.value)
                    if (owner) el.type.value = owner.type
                }
                if (source === 'location' && el.location.value) {
                    const owner = optionsTree.find((item) => item.locations.includes(el.location.value))
                    if (owner && !el.name.value) {
                        el.name.value = owner.name
                        el.type.value = owner.type
                    }
                }
                fillSelect(el.name, namesFor(el.type.value), el.name.value)
                fillSelect(el.location, locationsFor(el.type.value, el.name.value), el.location.value)
            }

            function showMessage(text, className) {
                el.tbody.replaceChildren()
                const tr = document.createElement('tr')
                const td = document.createElement('td')
                td.colSpan = 5
                td.className = 'state-cell' + (className ? ` ${className}` : '')
                td.textContent = text
                tr.appendChild(td)
                el.tbody.appendChild(tr)
            }

            function typeCell(type) {
                const td = document.createElement('td')
                const badge = document.createElement('span')
                if (type === '0') {
                    badge.className = 'badge env'
                    badge.textContent = '环境'
                    badge.title = '环境质量监测点'
                } else if (type === '1') {
                    badge.className = 'badge nuclear'
                    badge.textContent = '核电'
                    badge.title = '核电厂监测点'
                } else {
                    badge.className = 'badge station'
                    badge.textContent = type || '—'
                }
                td.appendChild(badge)
                return td
            }

            function valueCell(value) {
                const td = document.createElement('td')
                td.className = 'num'
                const match = /^\s*([\d.]+)\s*(.*)$/.exec(value || '')
                if (!match) {
                    td.textContent = value || '—'
                    return td
                }
                const num = document.createElement('b')
                num.textContent = match[1]
                td.appendChild(num)
                if (match[2]) {
                    const unit = document.createElement('span')
                    unit.className = 'unit'
                    unit.textContent = match[2]
                    td.appendChild(unit)
                }
                return td
            }

            function copyCell(row) {
                const td = document.createElement('td')
                td.className = 'nowrap'
                const button = document.createElement('button')
                button.type = 'button'
                button.className = 'link-btn'
                button.title = '复制该行数据'
                button.textContent = '复制'
                button.addEventListener('click', async () => {
                    const copied = await siteUtils.copyText(siteUtils.rowCopyText(row, displayDate(row.date)))
                    toast(copied ? '已复制到剪贴板' : '复制失败', copied ? undefined : 'error')
                })
                td.appendChild(button)
                return td
            }

            function renderRows(rows) {
                el.tbody.replaceChildren()
                const fragment = document.createDocumentFragment()
                for (const row of rows) {
                    const tr = document.createElement('tr')
                    const dateCell = document.createElement('td')
                    dateCell.className = 'nowrap'
                    dateCell.textContent = displayDate(row.date)
                    const timeCell = document.createElement('td')
                    timeCell.className = 'nowrap muted'
                    timeCell.textContent = row.time || '—'
                    tr.append(dateCell, valueCell(row.value), typeCell(row.type), timeCell, copyCell(row))
                    fragment.appendChild(tr)
                }
                el.tbody.appendChild(fragment)
            }

            function setLoading(busy) {
                el.submitBtn.disabled = busy
                el.submitBtn.textContent = busy ? '查询中…' : '查询'
            }

            async function runQuery() {
                if (!el.name.value || !el.location.value) {
                    el.meta.textContent = '请选择名称和位置'
                    showMessage('请选择名称和位置', 'empty')
                    return
                }
                if (!el.date.value) {
                    toast('请选择日期', 'error')
                    return
                }

                const seq = ++requestSeq
                setLoading(true)
                el.meta.textContent = '查询中…'
                showMessage('查询中…')

                try {
                    const rows = await post('nuclear_data', {
                        type: el.type.value,
                        name: el.name.value,
                        location: el.location.value,
                        date: el.date.value,
                    })
                    if (seq !== requestSeq) return

                    el.meta.textContent = `${el.name.value} · ${el.location.value} · ${el.date.value} 及前 3 天 · 共 ${rows.length} 条`
                    if (!rows.length) {
                        showMessage('没有找到符合条件的数据', 'empty')
                        return
                    }
                    renderRows(rows)
                } catch (error) {
                    if (seq !== requestSeq) return
                    el.meta.textContent = '查询失败'
                    showMessage(error.message || '查询失败', 'error')
                } finally {
                    if (seq === requestSeq) setLoading(false)
                }
            }

            el.type.addEventListener('change', () => {
                syncSelects('type')
                runQuery()
            })

            el.name.addEventListener('change', () => {
                syncSelects('name')
                runQuery()
            })

            el.location.addEventListener('change', () => {
                syncSelects('location')
                runQuery()
            })

            el.date.addEventListener('change', runQuery)

            el.form.addEventListener('submit', (event) => {
                event.preventDefault()
                runQuery()
            })

            async function init() {
                setDefaultDate()
                await loadOptionsTree()
                syncSelects('type')
                showMessage('选择名称和位置后查询', 'empty')
            }

            init()
        })()
    </script>
</body>

</html>
