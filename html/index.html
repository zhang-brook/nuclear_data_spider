<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>辐射环境监测数据</title>
    <link rel="stylesheet" href="./common.css">
    <script src="./layout.js" defer></script>
    <style>
        .hero {
            padding: 34px 28px;
        }

        .hero h2 {
            margin: 0;
            font-size: 22px;
        }

        .hero p {
            margin: 10px 0 0;
            max-width: 700px;
            color: var(--muted);
            font-size: 14px;
            line-height: 1.8;
        }

        .hero .actions {
            margin-top: 18px;
        }

        .hero .btn {
            display: inline-flex;
            align-items: center;
            text-decoration: none;
        }

        .feature-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 14px;
            margin-top: 14px;
        }

        .feature {
            display: flex;
            flex-direction: column;
            padding: 20px;
            color: inherit;
            text-decoration: none;
            transition: box-shadow .15s, border-color .15s;
        }

        .feature:hover {
            border-color: #c7d2e4;
            box-shadow: 0 6px 18px rgba(15, 23, 42, .08);
        }

        .feature h3 {
            margin: 0;
            font-size: 15px;
        }

        .feature p {
            margin: 8px 0 0;
            color: var(--muted);
            font-size: 13px;
            line-height: 1.7;
        }

        .feature span {
            margin-top: auto;
            padding-top: 14px;
            color: var(--primary);
            font-size: 13px;
        }

        .overview {
            margin-top: 14px;
            padding: 20px;
        }

        .overview h2 {
            margin: 0;
            font-size: 15px;
        }

        .overview-head {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 6px 16px;
            flex-wrap: wrap;
        }

        .overview-head .meta {
            margin: 0;
        }

        .overview-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 12px;
            margin-top: 14px;
        }

        .overview-grid .stat {
            padding: 14px 16px;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: #f8fafc;
        }

        .overview-grid .stat b {
            font-size: 20px;
            line-height: 1.3;
        }

        .overview-types {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
            margin-top: 12px;
        }

        .type-block {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 12px;
            padding: 14px 16px;
            border-radius: 8px;
            font-size: 13px;
        }

        .type-block.env {
            background: #eef2ff;
            color: #3730a3;
        }

        .type-block.nuclear {
            background: #fff7ed;
            color: #9a3412;
        }

        .type-block b {
            font-size: 20px;
            font-weight: 600;
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
        }

        @media (max-width: 720px) {
            .hero {
                padding: 24px 20px;
            }

            .overview-grid {
                grid-template-columns: 1fr;
            }

            .overview-types {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <header id="site-nav" class="topbar"></header>

    <main class="wrap">
        <section class="card hero">
            <h2>全国辐射环境监测历史数据</h2>
            <p>汇总国家核安全局公开的辐射环境监测数据，自 2023-08-25 起持续记录<span id="hero-update"></span>。可按测点查看历史值，或按类型、位置、时间与数值范围筛选，并通过曲线观察变化趋势。</p>
            <div class="actions">
                <a class="btn primary" href="./query.html">开始查询</a>
                <a class="btn primary" href="./chart.html">数据曲线</a>
                <a class="btn" href="./basic.html">基础查询</a>
            </div>
        </section>

        <section class="card overview" aria-label="数据概览">
            <div class="overview-head">
                <h2>数据概览</h2>
                <p class="meta" id="overview-range">加载中…</p>
            </div>
            <div class="overview-grid" id="overview-stats">
                <div class="stat"><b>加载中…</b><span>数据概览</span></div>
            </div>
            <div class="overview-types" id="overview-types" hidden></div>
        </section>

        <div class="feature-grid">
            <a class="card feature" href="./query.html">
                <h3>数据列表</h3>
                <p>按类型、位置、时间、数值与关键词组合筛选，支持分页浏览和 CSV 导出。</p>
                <span>进入</span>
            </a>
            <a class="card feature" href="./chart.html">
                <h3>数据曲线</h3>
                <p>选择具体测点，查看最近 N 条或指定日期范围内的辐射剂量率变化曲线。</p>
                <span>进入</span>
            </a>
            <a class="card feature" href="./basic.html">
                <h3>基础查询</h3>
                <p>选择具体测点与日期，查看当天及前 3 天的监测记录。</p>
                <span>进入</span>
            </a>
        </div>
    </main>

    <footer id="site-footer" class="footer"></footer>
</body>

</html>
